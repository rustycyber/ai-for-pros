[project]
name = "s08-tools-function-calling"
version = "0.1.0"
description = "Tools & Function Calling Lab - Build 3 tools and wire them into an agent loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["share/tests", "solution/tests", "starter/tests"]
addopts = "-v"
